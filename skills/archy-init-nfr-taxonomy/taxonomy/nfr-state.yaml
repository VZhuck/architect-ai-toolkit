run_id: "folder name. miner: run argument or <common-parent-slug>-<yyyymmdd-hhmm>; propose: draft argument or <target-doc-slug>-<yyyymmdd-hhmm>"
path_args:
  - "path argument(s) as the user typed them, for the record"
taxonomy_dir: "path/to/taxonomy/which/was/resolved/when/archy-init-nfr-taxonomy/executed"
taxonomy_version: "taxonomy version reported by archy-init-nfr-taxonomy"
session_ids:
  - "every session id that touched this run"
active_skill: "SKILL name which pipeline is currently run"
active_stage: "stage-0|stage-1|stage-2|hand-off|finished"   # hand-off: propose draft waits for /archy-nfr-apply
active_step: "step within the active stage, e.g. 1-map, 2-review-parked"
update_on: "date-time timestamp (with timezone info) when file was updated"

# Identity: the resolved input set. Stage 0 matches runs/drafts on these paths.
#   archy-nfr-miner:   source documents to mine
#   archy-nfr-propose: input run registries (ai-workflow/nfr-state/<run>/nfr-registry-log.md);
#                      normalized/images stay empty, status is pending|merged|skipped|stale
files_4_review:
  - path: "docs/fileA.md"             # repo-relative
    sha256: "content hash at last normalize/mine"
    normalized: ""                    # sources/<rel>.<ext>.md for .docx/.pdf, empty for .md/.mdx
    status: "pending"                 # pending|mined|merged|failed|skipped|stale
    reason: ""                        # why failed/skipped
    images: 0                         # images/diagrams not mined (count from normalize)
  - path: "docs/fileB.pdf"
    sha256: ""
    normalized: "sources/docs/fileB.pdf.md"
    status: "pending"
    reason: ""
    images: 0

# archy-nfr-propose only (omit for miner runs): the NFR document(s) the draft targets.
# target_sad_docs:
#   - path: "<nfr_doc>"                              # repo-relative; nfr_doc param, else NFR_PATH (env, then repo-root .env)
#     sha256: "hash of the target when the draft started; empty when it did not exist"
#     exists: true                                     # false: drafted from nfr-req-tmpl.md
#     draft: "draft.md"                                # relative to the draft folder
#     format_source: "gc"                              # gc|template

state_log:
  - date: "date-time-timestamp"
    skill: "skill, which introduces change"
    gate: "skill stage/check etc"
    change: "state change description"
    status: "started|finished|stopped|fail|etc."
